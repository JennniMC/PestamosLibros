spring.application.name=PestamosLibros
server.port=33666

# Configuración de MySQL (Crea la base de datos automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/baseLibroE?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate DDL (Genera las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true